<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Google Sheet Form</title>
  <style>
    body {
      font-family: Arial;
      max-width: 400px;
      margin: 40px auto;
    }
    input, textarea, button {
      width: 100%;
      margin: 6px 0;
      padding: 8px;
    }
    #success {
      color: green;
      display: none;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<h2>Add Record</h2>

<!-- 🔒 Hidden iframe -->
<iframe name="hiddenFrame" style="display:none;"></iframe>

<form 
  action="https://script.google.com/macros/s/AKfycby-77KvaLWpH3ZRtkfXL0ZxYtal3IvnWBAM4W47VJA4eO0k2GUu655gfNMRpsLEEVoziQ/exec"
  method="POST"
  target="hiddenFrame"
  onsubmit="handleSubmit()">

  <input name="name" placeholder="Name" required>
  <input name="email" placeholder="Email" required>
  <textarea name="message" placeholder="Message" required></textarea>

  <button type="submit">Submit</button>
</form>

<div id="success">✅ Data saved successfully</div>

<script>
function handleSubmit() {
  document.getElementById("success").style.display = "block";
  setTimeout(() => {
    document.querySelector("form").reset();
  }, 500);
}
</script>

</body>
</html>
